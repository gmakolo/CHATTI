{% extends "base.html" %}

{% block content %}
<main class="auth-page">
    <section class="auth-card recovery-card">
        <p class="recovery-kicker">ACCOUNT RECOVERY</p>
        <h2>Choose a new password</h2>
        <p class="recovery-copy">Create a new password for your CHATTI account.</p>
        <form method="POST" class="recovery-form">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" name="password" minlength="6" maxlength="8"
                   pattern="([A-Za-z0-9]{6}|[A-Za-z0-9]{8})" autocomplete="new-password" required>
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" name="confirm_password" minlength="6" maxlength="8"
                   pattern="([A-Za-z0-9]{6}|[A-Za-z0-9]{8})" autocomplete="new-password" required>
            <small>Password must be exactly 6 or 8 letters or numbers, with no spaces or symbols.</small>
            <button type="submit">Reset password</button>
        </form>
        <p class="recovery-back"><a href="/login">Back to log in</a></p>
    </section>
</main>
{% endblock %}
