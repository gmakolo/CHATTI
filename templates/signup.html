{% extends "base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h2>Create Account ✨</h2>
        <p style="opacity:0.7; margin-bottom:15px;">
            Join CHATTI and start chatting
        </p>

        <form method="POST">

            <input 
                type="text" 
                name="username" 
                placeholder="Username" 
                autocomplete="username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email address"
                autocomplete="email"
                required
            >

            <input 
                type="password" 
                name="password" 
                placeholder="Password" 
                minlength="6"
                maxlength="8"
                pattern="([A-Za-z0-9]{6}|[A-Za-z0-9]{8})"
                title="Use exactly 6 or 8 English letters or numbers, with no spaces or symbols"
                autocomplete="new-password"
                required
            >
            <p class="password-hint">Password must be exactly 6 or 8 letters or numbers, with no spaces or symbols.</p>

            <button type="submit">Sign Up</button>

        </form>

        <p style="margin-top:15px;">
            Already have an account? 
            <a href="/login">Log in</a>
        </p>

    </div>

</div>

{% endblock %}
