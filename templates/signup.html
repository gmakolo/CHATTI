{% extends "base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h2>Create Account ✨</h2>
        <p style="opacity:0.7; margin-bottom:15px;">
            Join CHATTI and start chatting
        </p>

        <form method="POST">

            <input 
                type="text" 
                name="username" 
                placeholder="Username" 
                autocomplete="username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email address"
                autocomplete="email"
                required
            >

            <div class="password-input-row signup-password-row">
                <input id="signup-password" type="password" name="password" placeholder="Password"
                       autocomplete="new-password" required data-password-limit>
                <label class="show-password"><input type="checkbox" data-password-toggle="signup-password"> Show</label>
            </div>
            <small class="password-limit-error" id="password-limit-error" hidden>Password cannot be more than 8 characters.</small>
            <p class="password-hint">Password must be exactly 6 or 8 letters or numbers, with no spaces or symbols.</p>

            <button type="submit">Sign Up</button>

        </form>

        <p style="margin-top:15px;">
            Already have an account? 
            <a href="/login">Log in</a>
        </p>

    </div>

</div>

{% endblock %}
