{% extends "base.html" %}

{% block content %}

<main class="login-page">
    <section class="login-shell" aria-labelledby="login-title">
        <div class="login-panel">
            <div class="login-panel-top"><span class="login-status-dot"></span> Your space to connect</div>
            <div class="login-form-wrap">
                <p class="login-eyebrow login-eyebrow-pink">WELCOME BACK</p>
                <h1 id="login-title">Log in to CHATTI</h1>
                <p class="login-subtitle">Pick up right where your conversations left off.</p>

                <form method="POST" class="login-form">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" placeholder="Enter your username"
                           autocomplete="username" required autofocus>

                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter your password"
                           autocomplete="current-password" required>

                    <label class="remember-me">
                        <input type="checkbox" name="remember_me" checked>
                        <span>Keep me signed in for 30 days</span>
                    </label>

                    <button type="submit">Log in <span aria-hidden="true">→</span></button>
                </form>

                <p class="login-switch">New to CHATTI? <a href="/signup">Create an account</a></p>
                <p class="login-forgot"><a href="/forgot-password">Forgot password?</a></p>
            </div>
            <p class="login-footer">Made for the people who make your day.</p>
        </div>
    </section>
</main>

{% endblock %}
